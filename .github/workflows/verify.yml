name: Exact verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - "proof/**"
      - "tools/**"
      - "data/**"
      - "verify_all.py"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "paper/**"
      - "proof/**"
      - "tools/**"
      - "data/**"
      - "verify_all.py"
      - ".github/workflows/verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: proof/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r proof/requirements.txt
      - name: Run exact certificate and structural checks
        run: python verify_all.py
